<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Livro</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <h1 th:text="${livro.id == null} ? 'Novo Livro' : 'Editar Livro'"></h1>

    <form th:action="@{/livros/salvar}" th:object="${livro}" method="post">
        <input type="hidden" th:field="*{id}">

        <label>Título:</label>
        <input type="text" th:field="*{titulo}">
        <span class="erro" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>

        <label>Autor:</label>
        <input type="text" th:field="*{autor}">
        <span class="erro" th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}"></span>

        <label>Ano de Publicação:</label>
        <input type="number" th:field="*{ano}">
        <span class="erro" th:if="${#fields.hasErrors('ano')}" th:errors="*{ano}"></span>

        <button type="submit" class="btn">Salvar</button>
        <a th:href="@{/livros}" class="btn btn-danger">Cancelar</a>
    </form>
</body>
</html>
